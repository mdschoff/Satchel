name: Windows smoke test

# Half of all Satchel downloads are Windows installers, but every line of this
# app has only ever been run by hand on macOS. `cargo test` proves the library
# layer compiles and passes on Windows; it does NOT prove that the installers
# install, that the app boots, or that the backend comes up.
#
# This job closes that gap without needing a human at a Windows desktop. The
# trick is that Satchel already exposes a headless assertion surface: the MCP
# server on 127.0.0.1:7825 (see .github/scripts/probe-mcp.ps1).
#
# Build once, then verify each installer format on its own clean runner. Both
# formats ship, both get downloaded, and they install to different locations
# via different machinery - so testing only one proves nothing about the other.
# Separate runners also mean the two apps can't collide on port 7825.
#
# Runs on every release tag (so no release ships unverified) and weekly (so a
# Windows-only regression from a dependency bump surfaces within 7 days).

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  schedule:
    # Mondays 09:00 UTC.
    - cron: "0 9 * * 1"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Build installers
        run: pnpm --filter @satchel/desktop tauri build

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: windows-installers
          path: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 7

  verify:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        installer: [msi, nsis]

    steps:
      - uses: actions/checkout@v7

      - name: Download installers
        uses: actions/download-artifact@v8
        with:
          name: windows-installers
          path: installers

      # ---------------------------------------------------------------------
      # 1. The installer itself works.
      # ---------------------------------------------------------------------
      - name: Install (MSI)
        if: matrix.installer == 'msi'
        shell: pwsh
        run: |
          $msi = Get-ChildItem installers -Recurse -Filter *.msi | Select-Object -First 1
          if (-not $msi) { throw "no MSI in the build artifact" }
          Write-Host "installing $($msi.Name)"
          $p = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @(
            "/i", "`"$($msi.FullName)`"", "/quiet", "/qn", "/norestart",
            "/l*v", "$env:RUNNER_TEMP\install.log"
          )
          if ($p.ExitCode -ne 0) {
            Get-Content "$env:RUNNER_TEMP\install.log" -Tail 60 -EA SilentlyContinue
            throw "msiexec failed with exit code $($p.ExitCode)"
          }

      - name: Install (NSIS)
        if: matrix.installer == 'nsis'
        shell: pwsh
        run: |
          $exe = Get-ChildItem installers -Recurse -Filter *-setup.exe | Select-Object -First 1
          if (-not $exe) { throw "no NSIS setup.exe in the build artifact" }
          Write-Host "installing $($exe.Name)"
          # /S is NSIS silent mode. Tauri's NSIS defaults to a currentUser
          # install, so this lands under %LOCALAPPDATA%, not Program Files.
          $p = Start-Process $exe.FullName -Wait -PassThru -ArgumentList "/S"
          if ($p.ExitCode -ne 0) { throw "NSIS installer failed with exit code $($p.ExitCode)" }

      - name: Locate installed executable
        id: locate
        shell: pwsh
        run: |
          # Don't hardcode one path - MSI installs per-machine and NSIS installs
          # per-user by default, and either default could change under us.
          $candidates = @(
            "C:\Program Files\Satchel\Satchel.exe",
            "${env:ProgramFiles(x86)}\Satchel\Satchel.exe",
            "$env:LOCALAPPDATA\Satchel\Satchel.exe",
            "$env:APPDATA\Local\Satchel\Satchel.exe"
          )
          $found = $candidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1

          if (-not $found) {
            # Widen the net before giving up, and report what we did find so a
            # changed install location is a one-line diagnosis, not a mystery.
            Write-Host "not in any expected location; searching..."
            $found = Get-ChildItem "C:\Program Files", "C:\Program Files (x86)", $env:LOCALAPPDATA `
                       -Filter Satchel.exe -Recurse -EA SilentlyContinue |
                     Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $found) { throw "Satchel.exe not found after installing the ${{ matrix.installer }} package" }

          Write-Host "found $found"
          "exe=$found" >> $env:GITHUB_OUTPUT

      # ---------------------------------------------------------------------
      # 2. It boots, and the backend actually comes up.
      # ---------------------------------------------------------------------
      - name: Boot app and probe the MCP server
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\.github\scripts\probe-mcp.ps1" `
            -Exe "${{ steps.locate.outputs.exe }}" -LogDir "$env:RUNNER_TEMP"

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: windows-smoke-logs-${{ matrix.installer }}
          path: |
            ${{ runner.temp }}/install.log
            ${{ runner.temp }}/satchel.out.log
            ${{ runner.temp }}/satchel.err.log
          if-no-files-found: ignore
          retention-days: 14
