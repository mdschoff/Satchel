packages:
  - "apps/*"
  - "packages/*"
  - "packages/renderers/*"
  - "packages/ai-providers/*"
allowBuilds:
  esbuild: true
onlyBuiltDependencies:
  - esbuild
# Force the patched dompurify past monaco-editor's transitive pin. This one
# actually ships (monaco-editor is a runtime dependency), so keep it current:
# 3.4.11 cleared 16 advisories against <=3.4.10, 3.4.13 clears
# GHSA-55q2-fjhq-7xh7 (detached subtree stays executable after IN_PLACE hook
# removal -> XSS).
#
# Every override is pinned to its CURRENT major (^) on purpose. A bare ">=x.y.z"
# lets pnpm satisfy the override with the next major - e.g. ">=3.3.17" on nanoid
# silently resolved to 6.0.1, which is ESM-only and would break postcss's CJS
# require. Patch the advisory, don't smuggle in a major bump.
overrides:
  dompurify: "^3.4.13"
  # Build-time only (postcss comes in via vite, a devDependency) but patch it
  # anyway - GHSA-r28c-9q8g-f849, path traversal in source-map auto-loading.
  postcss: "^8.5.18"
  # Also build-time only (nanoid comes in under postcss) - GHSA-2v37-7h3g-55p8,
  # custom generators loop forever when size is zero.
  nanoid: "^3.3.17"
  # Ships (tiptap powers the note editor) - GHSA-cp6q-959q-f8rh, mergeAttributes()
  # turns an own __proto__ key into inherited executable DOM attributes.
  # GitHub's advisory range says "< 3.30.4", but 2.27.3 is the 2.x backport:
  # its dist carries the `if (key === '__proto__') Object.defineProperty(...)`
  # guard, verified by diffing the published tarball against 2.27.2. So this is
  # a patch bump, not the 2.x -> 3.x migration the advisory implies.
  "@tiptap/core": "^2.27.3"
  # Build-time only (browserslist comes in under @babel via @vitejs/plugin-react,
  # a devDependency) - GHSA-73wf-gq98-2v4g and GHSA-c83g-rgw3-j3cx.
  browserslist: "^4.28.7"
